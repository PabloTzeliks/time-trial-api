spring:
  application:
    name: Time Trial API

time-trial:
  secret-keys:
    tempo-minimo-volta: 2000
    tempo-maximo-volta: 30000

cassandra:
  contact-points: cassandra-1, cassandra-2, cassandra-3
  local-datacenter: dc1
  keyspace-name: time_trial
  request:
    consistency: QUORUM

mqtt:
  broker: ssl://12f590a554fc4cfda1e6e2edd8381c84.s1.eu.hivemq.cloud:8883
  client-id: spring-backend-timetrial-${random.uuid}
  topic: senai/timetrial/corrida/sensor
  username: ${USER_HIVEMQ}
  password: ${PASSWORD_HIVEMQ}

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  endpoint:
    health:
      show-details: always