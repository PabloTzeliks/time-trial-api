spring:
  application:
    name: Time Trial API

  cassandra:
    contact-points: ${SPRING_CASSANDRA_CONTACT_POINTS:127.0.0.1}
    port: ${SPRING_CASSANDRA_PORT:9042}
    local-datacenter: ${SPRING_CASSANDRA_LOCAL_DATACENTER:dc1}
    keyspace-name: ${SPRING_CASSANDRA_KEYSPACE_NAME:time_trial}
    schema-action: none
    request:
      consistency: QUORUM

time-trial:
  secret-keys:
    tempo-minimo-volta: 2000
    tempo-maximo-volta: 30000

mqtt:
  broker: ssl://12f590a554fc4cfda1e6e2edd8381c84.s1.eu.hivemq.cloud:8883
  client-id: spring-backend-timetrial-${random.uuid}
  topic: senai/timetrial/corrida/sensor
  username: ${USER_HIVEMQ}
  password: ${PASSWORD_HIVEMQ}


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: never
  metrics:
    enable:
      logback: true
      all: true