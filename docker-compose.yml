version: '3.8'

services:
  cassandra-1:
    image: cassandra:latest
    container_name: cassandra-node-1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TimeTrialCluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - MAX_HEAP_SIZE=384M
      - HEAP_NEWSIZE=128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
    networks:
      - timetrial-net

  cassandra-2:
    image: cassandra:latest
    container_name: cassandra-node-2
    environment:
      - CASSANDRA_CLUSTER_NAME=TimeTrialCluster
      - CASSANDRA_SEEDS=cassandra-1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - MAX_HEAP_SIZE=384M
      - HEAP_NEWSIZE=128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
    depends_on:
      cassandra-1:
        condition: service_healthy
    networks:
      - timetrial-net

  cassandra-3:
    image: cassandra:latest
    container_name: cassandra-node-3
    environment:
      - CASSANDRA_CLUSTER_NAME=TimeTrialCluster
      - CASSANDRA_SEEDS=cassandra-1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - MAX_HEAP_SIZE=384M
      - HEAP_NEWSIZE=128M
    depends_on:
      cassandra-2:
        condition: service_healthy
    networks:
      - timetrial-net

  cassandra-init:
    image: cassandra:latest
    container_name: cassandra-time-trial-init
    depends_on:
      cassandra-1:
        condition: service_healthy
    networks:
      - timetrial-net
    command: >
      bash -c "
      echo 'Verificando cluster via rede CQL...';
      READY=0;
      for i in {1..60}; do
        PEERS=\$$(cqlsh cassandra-1 -e 'SELECT rack FROM system.peers' | grep -c 'rack1' || echo 0);
        if [ \"\$$PEERS\" -ge 2 ]; then
          echo 'Cluster 100% sincronizado!'; READY=1; break;
        fi;
        echo \"Aguardando nós (tentativa \$$i/60)...\"; sleep 10;
      done;
      if [ \$$READY -eq 0 ]; then
        echo 'Falha: Cluster nao subiu a tempo.'; exit 1;
      fi;
      echo 'Criando tabelas...';
      cqlsh cassandra-1 -e \"CREATE KEYSPACE IF NOT EXISTS time_trial WITH replication = {'class': 'NetworkTopologyStrategy', 'dc1': '3'}; USE time_trial; CREATE TABLE IF NOT EXISTS volta (sessao_id text, carro_id text, ts bigint, duracao_ms bigint, PRIMARY KEY ((sessao_id), carro_id, ts)) WITH CLUSTERING ORDER BY (carro_id ASC, ts DESC); CREATE TABLE IF NOT EXISTS pista (id text, nome text, tempo_minimo_ms bigint, tempo_maximo_ms bigint, PRIMARY KEY (id));\" && echo 'Tabelas criadas com sucesso!'"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - timetrial-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - timetrial-net

  time-trial-api:
    build: .
    container_name: time-trial-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    environment:
      - SPRING_CASSANDRA_CONTACT_POINTS=cassandra-1,cassandra-2,cassandra-3
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_KEYSPACE_NAME=time_trial
      - SPRING_CASSANDRA_LOCAL_DATACENTER=dc1
    networks:
      - timetrial-net

networks:
  timetrial-net:
    driver: bridge