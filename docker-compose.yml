version: '3.8'

services:
  cassandra-1:
    image: cassandra:latest
    container_name: cassandra-node-1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TimeTrialCluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
    networks:
      - timetrial-net

  cassandra-2:
    image: cassandra:latest
    container_name: cassandra-node-2
    environment:
      - CASSANDRA_CLUSTER_NAME=TimeTrialCluster
      - CASSANDRA_SEEDS=cassandra-1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    depends_on:
      cassandra-1:
        condition: service_healthy
    networks:
      - timetrial-net

  cassandra-3:
    image: cassandra:latest
    container_name: cassandra-node-3
    environment:
      - CASSANDRA_CLUSTER_NAME=TimeTrialCluster
      - CASSANDRA_SEEDS=cassandra-1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    depends_on:
      cassandra-1:
        condition: service_healthy
    networks:
      - timetrial-net

  cassandra-init:
    image: cassandra:latest
    container_name: cassandra-time-trial-init
    depends_on:
      cassandra-1:
        condition: service_healthy
    networks:
      - timetrial-net
    command: >
      bash -c "
      echo 'Aguardando cluster estabilizar...' &&
      for i in {1..30}; do
        if [ \"$$(nodetool -h cassandra-1 status | grep -c '^UN ')\" -ge 3 ]; then
          echo 'Cluster pronto!'; break;
        fi
        echo 'Esperando nós sincronizarem...'; sleep 10;
      done &&
      cqlsh cassandra-1 -e \"CREATE KEYSPACE IF NOT EXISTS time_trial WITH replication = {'class': 'NetworkTopologyStrategy', 'dc1': '3'}; USE time_trial; CREATE TABLE IF NOT EXISTS feed_recente (agrupador text, timestamp_ms bigint, carro_id text, tempo_volta_ms bigint, PRIMARY KEY ((agrupador), timestamp_ms)) WITH CLUSTERING ORDER BY (timestamp_ms DESC); CREATE TABLE IF NOT EXISTS historico_carro (carro_id text, timestamp_ms bigint, PRIMARY KEY ((carro_id), timestamp_ms)) WITH CLUSTERING ORDER BY (timestamp_ms DESC); CREATE TABLE IF NOT EXISTS podio_global (agrupador text, tempo_volta_ms bigint, carro_id text, PRIMARY KEY ((agrupador), tempo_volta_ms, carro_id)) WITH CLUSTERING ORDER BY (tempo_volta_ms ASC, carro_id ASC);\" &&
      echo 'Tabelas criadas com sucesso!'"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - timetrial-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - timetrial-net

  time-trial-api:
    build: .
    container_name: time-trial-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    environment:
      - SPRING_CASSANDRA_CONTACT_POINTS=cassandra-1,cassandra-2,cassandra-3
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_KEYSPACE_NAME=time_trial
      - SPRING_CASSANDRA_LOCAL_DATACENTER=dc1
    networks:
      - timetrial-net

networks:
  timetrial-net:
    driver: bridge